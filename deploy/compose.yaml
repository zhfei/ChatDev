name: chatdev-personal
services:
  app:
    image: chatdev:${CHATDEV_VERSION:?Run deploy.sh first}
    env_file: .env
    restart: unless-stopped
    ports: ['127.0.0.1:8080:8080']
    stop_grace_period: 40s
    mem_limit: 1200m
    cpus: 1.5
    volumes:
      - data:/app/data
      - workspace:/app/WareHouse
      - logs:/app/logs
      - temp:/app/temp
      - workflows:/app/yaml_instance
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  data:
  workspace:
  logs:
  temp:
  workflows:
